<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HeartRisk – {% block title %}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <span class="brand-icon">🫀</span>
        <span class="brand-name">HeartRisk</span>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a></li>
        <li><a href="/models" class="nav-link {% if request.path == '/models' %}active{% endif %}">Models</a></li>
        <li><a href="/risk" class="nav-link nav-cta {% if request.path == '/risk' %}active{% endif %}">Risk Assessment</a></li>
      </ul>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>HeartRisk &nbsp;·&nbsp; CDC BRFSS Dataset &nbsp;·&nbsp; Built with PySpark ML</p>
    <p class="footer-note">For educational purposes only. Always consult a qualified doctor.</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
